"$schema" = "../../starship/config-schema.json"

add_newline = false

# How long Starship spends looking for directory context (like Git repos or package files) to determine the prompt's layout
scan_timeout = 2000

# How long Starship waits for a specific module to execute a script or system command (like finding a Node.js version)
# before giving up and aborting it. [1]
command_timeout = 2000

# THE ONE DIFFERENCE FROM THE SHARED CONFIG: the directory (cwd) is YELLOW.
#
# Everything else here is envs/starship/starship.toml verbatim, so the
# tcsh prompt is the SAME prompt the bash env shows -- same modules, same
# glyphs, same git branch, same LSF/user handling -- with one deliberate
# change: the path is yellow, so a glance at the prompt says which shell you
# are in (bash keeps the shared config's bold cyan path).
#
# `tests/env-tcsh-starship` asserts this file differs from the shared config
# ONLY in the directory style, so the two cannot drift apart.
format = """
(${custom.username}$custom.host${custom.lsf}$git_branch$git_status$cmd_duration$python\n)$directory
$character"""

[custom.username]
when = 'for u in $LOADOUT_CFG_STARSHIP_USERIDS_TO_HIGHLIGHT; do [ "$(whoami)" = "$u" ] && exit 0; done; exit 1'
shell = ["/bin/bash"]
command = 'whoami'
format = "[$output]($style) "
style = "bold yellow"

# The hostname, when LOADOUT_CFG_PROMPT_INCLUDE_HOST=1.
#
# The switch is exported by every shell env, and the hand-rolled fallback
# prompts honor it. This module is what makes the STARSHIP prompt honor it
# too -- without it the preference was silently ignored in every shell where
# starship drives the prompt (the default).
#
# On an LSF node the hostname is already carried by custom.lsf ("LSF:<host>"),
# so the plain host is suppressed there: no double host.
[custom.host]
when = 'test "$LOADOUT_CFG_PROMPT_INCLUDE_HOST" = "1" && test -z "$LSB_JOBID"'
shell = ["/bin/bash"]
command = "hostname -s"
format = "[$output]($style) "
style = "bold dimmed white"

[custom.lsf]
when = 'test -n "$LSB_JOBID"'
shell = ["/bin/bash"]
command = "hostname -s"
format = "[LSF:$output]($style) "
style = "bold red"

[directory]
truncation_length = 0
truncate_to_repo = false
style = "bold yellow"
format = "[$path]($style) "

[git_branch]
style = "bold blue"

[git_status]
style = "bold yellow"

# A threshold for the previous command you ran. It dictates how fast a command must execute before the terminal
# displays a timer indicating how long it took.
[cmd_duration]
min_time = 5000
style = "bold violet"
format = "[took $duration]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[python]
symbol = "🐍"
format = '[${symbol}${pyenv_prefix}(${version})(\($virtualenv\))](bold yellow) '
pyenv_prefix = "venv "
