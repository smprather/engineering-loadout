theme = "tokyonight-night"

# ── Workspace trust ───────────────────────────────────────────────────────────
# helix 25.07.1 starts NO language server in an untrusted workspace. On first
# open it shows a modal -- "Trusted workspaces may load local config files and
# auto-start language servers. Config and language servers can execute
# arbitrary code." -- and until it is answered, taplo and markdown-oxide (both
# bundled and enabled in languages.toml) simply never spawn. A user who
# dismisses it gets a silently server-less editor and no hint why.
#
# Answer it ONCE per workspace. The decision PERSISTS -- helix records it in
# `trusted_workspaces` under its data dir (~/.local/share/helix) -- and it can
# be changed later from inside the editor with `:workspace-trust` /
# `:workspace-untrust`. It is not a per-session prompt.
#
# `insecure = true` in [editor] below skips that modal globally, and IS SET --
# a deliberate, owner-made call (2026-08-13), not a default anybody drifted
# into. Record of what was traded away, so it can be re-judged rather than
# re-derived:
#
#   COST: on a SHARED FARM FILESYSTEM this means any directory a user opens --
#   including one owned by someone else -- has its local .helix/ config honoured
#   and its language servers launched. That is the arbitrary-code path helix's
#   own warning above describes.
#
#   WHY IT IS ACCEPTED HERE: the deployment target is a closed, highly
#   controlled engineering environment (TSMC and comparable self-imposed
#   constraints), where who can place files on the shared tree is already tightly
#   governed by controls outside this editor. Against that, the modal is pure
#   friction: bundled taplo and markdown-oxide silently never spawn until it is
#   answered, and a dismissed prompt looks exactly like a broken install.
#
# REVISIT IF the loadout is ever deployed somewhere the shared filesystem is not
# governed that way -- an untrusted multi-tenant box, a contractor share, a
# machine reachable by people outside the controlled environment. There the
# right answer flips back to leaving this off and answering the prompt once per
# workspace (`:workspace-trust`).
#
# The narrower fix, when it becomes available, is upstream's
# `[editor.workspace-trust] level = "servers"` -- it trusts server launches
# while STILL gating local config, which is strictly better than `insecure` for
# this use and would let the cost paragraph above go away. NO RELEASED helix has
# it; it is master-only. 25.07.1 (published 2025-07-18) is still upstream's
# newest release as of 2026-08-13, and it REJECTS the key as an unknown field,
# which makes helix fall back to the ENTIRE default config and silently discard
# every other setting in this file. Do not add it speculatively -- check
# `helix-editor/helix` releases first. The 13-month gap means the next release
# will likely carry it; prefer it over `insecure` when it lands.
#
# NOTE: this file is loadout-owned and `_install_env_helix` overwrites it on
# every install, so editing the INSTALLED copy does not survive a reinstall.

[editor]
insecure = true               # see "Workspace trust" above -- deliberate, owner-decided
line-number = "relative"
cursorline = true
mouse = false
idle-timeout = 250
rulers = []
scrolloff = 999               # keep cursor vertically centered (matches scrolloff = 999)
bufferline = "multiple"
auto-pairs = true
auto-format = true            # format on save (matches conform BufWritePre)
text-width = 130              # matches textwidth = 130
color-modes = true            # colorize mode indicator per mode
rainbow-brackets = true
true-color = true             # matches termguicolors = true

[editor.soft-wrap]
enable = true                 # matches wrap = true
wrap-at-text-width = true     # wrap at textwidth = 130

[editor.search]
smart-case = true             # matches smartcase + ignorecase

[editor.whitespace.render]
space = "none"
tab = "all"                   # matches listchars tab = "» "
newline = "none"

[editor.whitespace.characters]
tab = "»"
tabpad = " "
space = "·"
nbsp = "␣"                    # matches listchars nbsp = "␣"

[editor.indent-guides]
render = true
character = "│"
skip-levels = 1

[editor.cursor-shape]
normal = "block"
insert = "block"              # matches guicursor = "i:block"
select = "underline"

[editor.gutters]
layout = ["diff", "diagnostics", "line-numbers", "spacer"]

[editor.gutters.line-numbers]
min-width = 2                 # matches numberwidth = 2

[editor.statusline]
left = ["mode", "spinner", "file-name", "file-modification-indicator", "diagnostics"]
center = []
right = ["version-control", "position", "file-encoding", "file-type"]
separator = "│"
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"

[editor.file-picker]
hidden = false                # show dotfiles (matches rg --hidden in global aliases)

[editor.lsp]
display-messages = true
auto-signature-help = true
display-inlay-hints = false
snippets = true

[keys.normal]
# mirrors nvim C-h/j/k/l window navigation
C-h = "jump_view_left"
C-j = "jump_view_down"
C-k = "jump_view_up"
C-l = "jump_view_right"
# Ctrl-s save (common muscle memory)
C-s = ":write"
