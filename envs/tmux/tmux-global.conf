# loadout-managed tmux defaults. Override these in tmux-user.conf.

# ---- theme selection --------------------------------------------------------
# @theme comes from the SETTINGS layers, which the DISPATCHER (tmux.conf) sources
# before this file: tmux-settings-global.conf first, then tmux-settings-user.conf,
# which wins.  This file deliberately does NOT source them again -- doing so
# re-applied the user layer from inside the managed layer, which made the
# global/user ordering meaningless and left a duplicate copy of the settings file.

# Source the chosen theme.  -F expands formats in the path, so the value of
# @theme selects the file: tmux-theme-loadout1.conf, tmux-theme-loadout2.conf.
#
# The path MUST be quoted.  Unquoted, the '#' in #{@theme} is treated as the
# start of a comment when a CONFIG FILE is parsed, and the line dies with
# "syntax error" -- verified both ways.  (It works unquoted as a shell command,
# which is why this is easy to get wrong.)
#
# NO -q: a missing file must fail LOUDLY, not silently.  With -q a typo in
# @theme -- or a filename/path mismatch -- is a silent no-op: the theme simply is
# not applied and you get tmux's default green bar.  That is not hypothetical;
# this line said `tmux_theme_` while the files had been renamed `tmux-theme-`, so
# no theme loaded at all and a reboot reverted the bar.  Same policy for every
# source-file in this tree.
# Check what @theme resolves to with:
#   tmux display-message -p '#{@theme}'
# (`tmux show-options -g @theme` errors with "invalid option".)
source-file -F "~/.config/tmux/themes/tmux-theme-#{@theme}.conf"

bind-key -n C-right   next-window
bind-key -n C-left    previous-window
bind-key -n S-right   select-pane -R
bind-key -n S-left    select-pane -L
bind-key -n S-down    select-pane -D
bind-key -n S-up      select-pane -U
bind-key    X         confirm-before kill-session
bind-key    r         display-message "Sourcing ~/.tmux.conf" \; source-file ~/.tmux.conf
bind-key    1         select-layout even-horizontal
bind-key    2         select-layout even-vertical
bind-key    3         select-layout main-horizontal
bind-key    4         select-layout main-vertical
bind-key    5         select-layout tiled
bind-key    6         run-shell 'bash ~/.config/tmux/scripts/tmux-3col-layout.sh'
bind-key    o         new-window \; split-window \; select-layout tiled \; split-window \; select-layout tiled \; split-window \; select-layout tiled \; split-window \; select-layout tiled \; split-window \; select-layout tiled \; split-window \; select-layout tiled \; run-shell 'bash ~/.config/tmux/scripts/tmux-3col-layout.sh'
bind-key -r Up        resize-pane -U
bind-key -r Down      resize-pane -D
bind-key -r Left      resize-pane -L
bind-key -r Right     resize-pane -R
bind-key -n C-s-Left  swap-window -t -1 -d
bind-key -n C-s-Right swap-window -t +1 -d
set -g default-shell /bin/bash

# PageUp enters tmux scrollback unless the foreground pane command is vim-like.
# Do not scan every process on the tty; orphaned helpers can false-match here.
bind-key -n Pageup if -F '#{m/r:^g?(view|n?vim?x?)(diff)?$,#{pane_current_command}}' \
  'send-keys Pageup' \
  'copy-mode -u'

# Open the tmux buffer in vi. The shell computes the per-user path so TMPDIR is
# honored when the tmux server inherited it; /tmp remains the fallback.
bind-key v run-shell 'buf="${TMPDIR:-/tmp}/tmux-buffer.${USER:-user}"; tmux capture-pane -S -; tmux save-buffer "$buf"; tmux delete-buffer; tmux send-keys "nvim \"$buf\"" Enter'

# remap prefix
set -g prefix 'C-\'
unbind C-b
bind 'C-\' send-prefix

# If set to 0, I get 0;10;1c on every 'tmux attach'
# https://github.com/microsoft/WSL/issues/5931
set -s escape-time 100

# Recommended by neovim :checkhealth
set -g focus-events on

# Colored undercurl test: printf '\e[4:3m\e[58:5:32mBlue Undercurled\n\e[0m'
# To display terminal features in effect: tmux display -p '#{client_termfeatures}'
set -s default-terminal "$TERM"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm' # undercurl
set -as terminal-overrides ',*:Setulc=\E[58::2::::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m' # Colored underline/undercurl
#set -as terminal-features ',ms-terminal:RGB'

set -w -g mode-keys vi

set -g renumber-windows on

# Silence the terminal bell: no audio passthrough and no "Bell in window X"
# flash. monitor-bell is left at its default so the status-line bell indicator
# still flags background windows (e.g. "build finished") -- only the noise goes.
set -g bell-action none
set -g visual-bell off
set -g visual-activity off

# Put the pwd on the right-side of the status line.
# Disabling since, long paths that collide with the
# window names is not handled well.
#set-option -g status-right '#{pane_current_path}'
#set-option -g status-interval 1

# Increase the size of scrollback buffer
set-option -g history-limit 10000

# Session persistence: tmux-persist, the maintained fork of the abandoned
# tmux-resurrect. It auto-saves and restores pane contents + layout per session
# on detach/exit/start, so it also covers what tmux-continuum used to add on top
# of resurrect (continuum was resurrect + a 60-min autosave loop). Options are
# read live, so no restart is needed after editing. Coming from resurrect, any
# unset @persist-* option falls back to the old @resurrect-* name and snapshots
# migrate on first load.
set -g @persist-save-on-exit 'on'
set -g @persist-auto-restore 'on'
# Where snapshots live; older ones are pruned after 7 days by default.
# set -g status-right 'Persist status: #{?}'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
# Tmux persist (maintained resurrect fork)
# Save:    Prefix + ctrl-s
# Restore: Prefix + ctrl-r
set -g @plugin 'hyoretsu/tmux-persist'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
#set -g @plugin 'tmux-plugins/tmux-yank'

set-option -g mouse on
set -g @scroll-without-changing-pane "on"
set -g @scroll-in-moused-over-pane "on"
set -g @emulate-scroll-for-no-mouse-alternate-buffer "on"

# Make double-click selection use the right word boundaries. tmux takes a
# LITERAL separator list -- not a Unicode class, not a regex -- and it cannot
# expand ranges or loop. So the ranges live in scripts/tmux-word-separators (a
# generator you run by hand), and its expanded output is sourced here. That keeps
# every reload free of any subprocess or interpreter dependency.
# Regenerate after changing the ranges:
#   ~/.config/tmux/scripts/tmux-word-separators
# Keep in step with wezterm's SelectTextAtMouseCursor("Word") separators.
source-file ~/.config/tmux/word-separators.conf

# In gnome-terminal and derivatives (mate-terminal), when selecting text, you
# see a random looking string of text. This fixes it and doesn't seem to have any
# ill effects. https://tinyurl.com/2vd2e2n7 (super long link to askubuntu.com)
#set -g set-clipboard on

# Pin plugin path explicitly so tpm's XDG auto-detection doesn't redirect to
# ~/.config/tmux/plugins/ (which is empty) instead of ~/.tmux/plugins/.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.tmux/plugins/"

set -g extended-keys on
# Check if the parent environment exported EXTENDED_KEYS_SUPPORTED as 1
%if "#{==:#{EXTENDED_KEYS_SUPPORTED},1}"
    set -s extended-keys on
    set -as terminal-features 'xterm*:extkeys'
%else
    set -s extended-keys off
%endif

bind-key    -T root         MouseDown3Pane         select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { paste-buffer -p }
bind-key    -T root         DoubleClick1Pane       select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-word ; run-shell -d 0.2 ; send-keys -X copy-pipe-and-cancel }
bind-key    -T root         TripleClick1Pane       select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-line ; run-shell -d 0.2 ; send-keys -X copy-pipe-and-cancel }
bind-key    -T copy-mode-vi MouseDragEnd1Pane      if-shell -F "#{?#{==:#{scroll_position},0},1,0}" { send-keys -X copy-selection-and-cancel } { send-keys -X copy-selection }
bind-key    -T copy-mode-vi DoubleClick1Pane       select-pane \; send-keys -X select-word \; run-shell -d 0.2 \; if-shell -F "#{?#{==:#{scroll_position},0},1,0}" { send-keys -X copy-pipe-and-cancel } { send-keys -X copy-pipe }
bind-key    -T copy-mode-vi TripleClick1Pane       select-pane \; send-keys -X select-line \; run-shell -d 0.2 \; if-shell -F "#{?#{==:#{scroll_position},0},1,0}" { send-keys -X copy-pipe-and-cancel } { send-keys -X copy-pipe }


