# tmux settings -- user-facing knobs.
#
# Sourced by the dispatcher (tmux.conf) BEFORE tmux-settings-user.conf.  This is
# the MANAGED BASELINE and the user layer overrides it -- so set your theme in
# tmux-settings-user.conf, not here.
# NOTE: because this baseline is the ORIGINAL theme, a missing or broken user
# layer falls back to a bar whose active window is 1.19:1 (effectively invisible).
# That is faithful to "stock", but it is not a safe fallback.

# ---- theme choice ----------------------------------------------------------
# Selects which theme file is loaded.  The value is interpolated into the
# filename tmux-theme-<value>.conf, so it must match a file's suffix exactly
# (and with no quotes or extension).
#
#   loadout1   the original pre-2026-10-01 theme.  Uses ANSI slot names, so it
#              resolves against the TERMINAL palette -- under catppuccin mocha
#              that puts the active window at 1.19:1, effectively invisible.
#   loadout2   current.  Pinned literal hex, dark-blue bar with lightened text,
#              green-free lineless pane dividers, raised active-pane fill.
set -g @theme "loadout1"
