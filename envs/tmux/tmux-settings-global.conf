# tmux settings -- user-facing knobs.
#
# Sourced by the dispatcher (tmux.conf) BEFORE tmux-settings-user.conf.  This is
# the MANAGED BASELINE and the user layer overrides it -- so set your theme in
# tmux-settings-user.conf, not here.
# The baseline is deliberately the SAFE choice: loadout2 pins every colour
# (pane fills included), so a missing or broken user layer still lands on a
# readable bar and an unambiguous active pane.

# ---- theme choice ----------------------------------------------------------
# Selects which theme file is loaded.  The value is interpolated into the
# filename tmux-theme-<value>.conf, so it must match a file's suffix exactly
# (and with no quotes or extension).
#
#   loadout2   DEFAULT.  Pinned literal hex, dark-blue bar with lightened text,
#              green-free lineless pane dividers, raised active-pane fill.
#              Every colour tmux can paint is explicit, so it renders the same
#              on any terminal background.
#   loadout1   the original pre-2026-10-01 theme, kept as a ROLLBACK.  Uses ANSI
#              slot names, so it resolves against the TERMINAL palette -- under
#              catppuccin mocha that puts the active window at 1.19:1, and it
#              paints no pane fill at all.
set -g @theme "loadout2"

# ---- focus follows mouse (FFM) ---------------------------------------------
# on: the pane under the mouse pointer takes focus on hover (no click).
# Requires tmux >= 3.7 (the option did not exist earlier; the bundled tmux is
# 3.7c) and mouse mode, which tmux-global.conf enables.  ON in the managed
# baseline -- opt OUT per user in tmux-settings-user.conf, which is sourced
# after this file so the user value wins:
#     set -g focus-follows-mouse off
%if "#{>=:#{version},3.7}"
set -g focus-follows-mouse on
%endif
