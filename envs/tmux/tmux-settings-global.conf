# tmux settings -- user-facing knobs.
#
# Sourced by the dispatcher (tmux.conf) BEFORE tmux-settings-user.conf.  This is
# the MANAGED BASELINE and the user layer overrides it -- so set your theme in
# tmux-settings-user.conf, not here.
# The baseline is deliberately the SAFE choice: loadout2 carries its own fixed
# dark palette (pane fills included), so a missing or broken user layer still
# lands on a readable bar and an unambiguous active pane.

# ---- theme choice ----------------------------------------------------------
# Selects which theme file is loaded.  The value is interpolated into the
# filename tmux-theme-<value>.conf, so it must match a file's suffix exactly
# (and with no quotes or extension).
#
#   loadout2   DEFAULT.  tmux 3.8 dark theme (`theme dark`): a literal-hex
#              palette in the ten dark-theme-* server options, dark-blue bar
#              with lightened text, green-free lineless pane dividers, raised
#              active-pane fill.  The palette is forced, so it renders the
#              same on any terminal background.
#   loadout1   the original pre-2026-10-01 theme, kept as a ROLLBACK.  tmux 3.8
#              `theme terminal` with an ANSI-name palette, so it resolves
#              against the TERMINAL palette -- under catppuccin mocha that puts
#              the active window at 1.19:1, and it paints no pane fill at all.
#
# The selected theme file sets the server-scoped `theme` option (dark or
# terminal) after these layers, so it wins here.  Do NOT override it for
# loadout2: that theme defines only dark-theme-* and its pane fills are
# literal, so `detect`/`light` would resolve the theme names to tmux's
# default light palette while the fills stayed dark, and `terminal` would
# bypass the palette entirely.  loadout1 is safe under any mode because both
# of its palettes are ANSI names.
set -g @theme "loadout2"

# ---- focus follows mouse (FFM) ---------------------------------------------
# on: the pane under the mouse pointer takes focus on hover (no click).
# Requires tmux >= 3.7 (the option did not exist earlier; the bundled tmux is
# 3.8) and mouse mode, which tmux-global.conf enables.  ON in the managed
# baseline -- opt OUT per user in tmux-settings-user.conf, which is sourced
# after this file so the user value wins:
#     set -g focus-follows-mouse off
%if "#{>=:#{version},3.7}"
set -g focus-follows-mouse on
%endif
