# loadout tmux dispatcher: managed defaults, then user overrides.
source-file -q ~/.config/tmux/tmux.global.conf

# During migration, use the legacy file only while the canonical user layer
# does not exist. The installer offers to move it to the XDG path.
if-shell 'test -f ~/.config/tmux/tmux.user.conf' \
    'source-file -q ~/.config/tmux/tmux.user.conf' \
    'source-file -q ~/.tmux.local.conf'

# Initialize TPM after both layers so the user layer can declare plugins.
run '~/.tmux/plugins/tpm/tpm'
