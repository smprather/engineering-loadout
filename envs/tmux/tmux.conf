# loadout tmux dispatcher: managed defaults, then user overrides.

# Settings are first so that they are customizable, but also usable
# in tmux-global.conf.
source-file ~/.config/tmux/tmux-settings-global.conf
source-file ~/.config/tmux/tmux-settings-user.conf

source-file ~/.config/tmux/tmux-global.conf
source-file ~/.config/tmux/tmux-user.conf

# Initialize TPM after both layers so the user layer can declare plugins.
run '~/.tmux/plugins/tpm/tpm'
