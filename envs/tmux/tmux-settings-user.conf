# tmux settings -- user-facing knobs.
#
# Sourced by the dispatcher (tmux.conf) AFTER tmux-settings-global.conf, so this
# layer WINS.  This is the one place to choose a theme; the theme files
# themselves live in ~/.config/tmux/themes/ and are managed (do not edit them).

# ---- theme choice ----------------------------------------------------------
# Selects which theme file is loaded.  The value is interpolated into the
# filename tmux-theme-<value>.conf, so it must match a file's suffix exactly
# (and with no quotes or extension).  Reload with Prefix+r after changing it.
#
#   loadout2   DEFAULT (matches the managed baseline).  tmux 3.8 `theme dark`
#              with a literal-hex palette in the ten dark-theme-* slots; pane
#              fills included, so it renders the same on any terminal
#              background.  Dark only -- do not override the server `theme`
#              option (detect/light would leave the design while the fills
#              stayed dark).
#   loadout1   the original pre-2026-10-01 theme (rollback).  tmux 3.8
#              `theme terminal` with an ANSI-name palette, so it resolves
#              against the TERMINAL palette; no pane fill.
#
# Switch theme:
#     set -g @theme "loadout1"
set -g @theme "loadout2"

# ---- focus follows mouse (FFM) ---------------------------------------------
# ON in the managed baseline (tmux >= 3.7; mouse mode is enabled by
# tmux-global.conf).  Uncomment to turn it OFF for this user:
# set -g focus-follows-mouse off
