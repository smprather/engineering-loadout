# tmux settings -- user-facing knobs.
#
# Sourced by the dispatcher (tmux.conf) AFTER tmux-settings-global.conf, so this
# layer WINS.  This is the one place to change the theme; the theme files
# themselves live in ~/.config/tmux/themes/ and are not edited here.

# ---- theme choice ----------------------------------------------------------
# Selects which theme file is loaded.  The value is interpolated into the
# filename tmux-theme-<value>.conf, so it must match a file's suffix exactly
# (and with no quotes or extension).
#
#   loadout2   DEFAULT (matches the managed baseline).  Pinned literal hex,
#              pane fills included, so it renders the same on any terminal
#              background.
#   loadout1   the original pre-2026-10-01 theme (rollback).  ANSI slot names
#              resolved against the TERMINAL palette; no pane fill.
set -g @theme "loadout2"

# ---- focus follows mouse (FFM) ---------------------------------------------
# ON in the managed baseline (tmux >= 3.7; mouse mode is enabled by
# tmux-global.conf).  Uncomment to turn it OFF for this user:
# set -g focus-follows-mouse off
