# Personal tmux overrides belong here. This file is preserved on reinstall.
# It is sourced after tmux-global.conf and before TPM initializes plugins.

# --- optional bundled plugins (off by default) ---------------------------------
# tmux-yank copies selections to the system clipboard. The plugin is vendored,
# so enabling it needs no network; it needs a clipboard tool on the host
# (xclip/xsel on X11, wl-copy on Wayland). Uncomment to enable, then reload
# (Prefix+r -- TPM runs on every config load) or restart tmux:
# set -g @plugin 'tmux-plugins/tmux-yank'
