# tmux theme -- loadout2
#
# Every colour and appearance setting for tmux lives here and nowhere else.
# ~/.config/tmux/tmux.conf sources this AFTER tmux-global.conf (whose colour
# values are placeholders) and BEFORE tmux-user.conf, so personal overrides in
# the user layer can still beat anything here.
#
# All values are literal hex, deliberately NOT ANSI slot names.  Slot names are
# resolved against the terminal's palette, and the point of this theme is that it
# renders identically on every machine regardless of the terminal theme.  Ratios
# are WCAG contrast against each pair's own background.
#
# That includes the TERMINAL BACKGROUND: every pane is painted (window-style /
# window-active-style, below), so no cell tmux draws is left for the terminal to
# colour.  The only options still at tmux's `default` are component styles that
# inherit an explicitly-pinned base -- each is named, with why, at the bottom.
#
# Full reasoning, and the record of what was tried and rejected, is in the repo:
#   cachyos-config/tmux.md
#   cachyos-config/customizations.md   (2026-10-01 entries)


# ---- status line -----------------------------------------------------------

# Bar background is a saturated dark blue; text lightened to #cdd6f4.
# Going "bluer" means raising the blue channel, "darker" means lowering overall
# luminance.  The floor is separation from the terminal's black: this is 1.206:1
# there; go much darker and the bar stops reading as a bar.
set -g status-style                  "fg=#cdd6f4 bg=#10173a"         # 12.04:1

# Session name as a filled blue chip.
set -g status-left-style             "fg=#11111b bg=#89b4fa,bold"    # 8.91:1
set -g status-left-length            20
set -g status-left                   " #S "

# ZOOM indicator.  tmux-persist (the persistence plugin actually installed) does
# not touch status-right, so this value is also what `show-options -g` reports.
set -g status-right-length           12
set -g status-right                  "#[fg=#fab387 bold]#{?window_zoomed_flag, ZOOM ,}"

# NOTE: never put a comma inside #[...] while that bracket sits inside #{?...}.
# The conditional splits its own arguments on commas and does NOT protect the
# bracket, so the tail leaks onto the bar as literal text -- a prefix-indicator
# chip written that way rendered a stray "bold]" on the status line.  Space-
# separate the attributes inside #[...] instead.

set -g window-status-separator       ""
set -g window-status-style           "fg=#a6adc8 bg=#10173a"         # 7.82:1
set -g window-status-format          " #I:#W "
set -g window-status-current-style   "fg=#11111b bg=#89b4fa,bold"    # 8.91:1
set -g window-status-current-format  " #I:#W "
set -g window-status-bell-style      "fg=#f38ba8 bg=#10173a,bold"    # 7.52:1

# Window formats carry #I:#W only -- deliberately no #F.  Its contributions were
# the "*" current marker (the blue block already says that) and the "-" last-used
# marker.  "Z" is covered by the ZOOM indicator above.  No activity style is
# pinned: monitor-activity is off, so the "#" flag never appears.  The bell flag
# DOES appear -- bell-action none suppresses the bell action, not the flag
# (verified on 3.7c: window_bell_flag still goes to 1) -- hence the style above.


# ---- panes -----------------------------------------------------------------

# NO VISIBLE BORDER LINE.  Both styles set fg and bg to the same colour, so the
# box-drawing glyph is painted in the same colour as the cell behind it and
# vanishes.  The border CELL is still filled with the STATUS BAR background,
# #10173a -- the same value status-style uses above, so the divider network reads
# as an extension of the bar rather than as chrome of its own.  That is 1.143:1
# against the active pane's fill (#090909) and 1.206:1 against the #000000
# inactive panes (the same 1.206:1 the bar itself has against black).  The
# divider therefore reads as a faint blue band, without any line being drawn.
#
# Because the border is brighter than the active fill, the active pane is the one
# pane whose border does NOT merge into it: that 1.143:1 step is a faint outline
# around the active pane, so it has a boundary of its own (before it was raised,
# the border reused #090909 and the active pane merged with the divider network).
# Earlier experiments on this knob: neutral #121212 (1.063:1) and green #101c13
# (1.135:1); this ties the border to the bar instead of tinting it.
#
# pane-border-lines has NO visual effect while fg == bg (the glyph colour equals
# the cell colour whatever the glyph shape is).  `heavy` is kept only so that
# restoring a visible line starts from the thick one -- measured when a line was
# visible: single draws 1px strokes, heavy draws 2px.
set -g pane-border-lines        heavy
set -g pane-border-style        "fg=#10173a bg=#10173a"
set -g pane-active-border-style "fg=#10173a bg=#10173a"
set -g pane-border-indicators   off

# Pane fills -- BOTH classes are painted by this theme, which is the point:
#   window-style         every pane that is NOT the active pane (tmux's own
#                        wording for it).  Pinned to pure black.
#   window-active-style  the active pane, raised one step (#090909).
# Together with the border cells above this is ALL that marks the active pane:
# no line, two fills only 1.055:1 apart, and a border 1.143:1 above the active
# fill.
#
# Pinning window-style is not cosmetic.  While it was left at tmux's default
# ("default" = paint nothing), the inactive fill WAS the terminal background:
# on a terminal whose own bg is black the raise read correctly, but on any
# lighter one (Windows Terminal, most dark themes) the active pane rendered
# DARKER than the inactive panes -- the whole scheme inverted, with tmux
# faithfully drawing exactly what it had been told.  Both fills are literal now,
# so the cue is identical on every terminal.
#
# fg is pinned too, so text an application leaves at the terminal default is
# theme-coloured rather than terminal-coloured.
# CAVEAT: a program that paints its own background (editors, full-screen TUIs)
# masks the fill -- it only exists on cells the program leaves at the default.
set -g window-style             "fg=#cdd6f4 bg=#000000"              # 14.52:1
set -g window-active-style      "fg=#cdd6f4 bg=#090909"              # 13.77:1


# ---- copy mode ---------------------------------------------------------------
# Selection, search hits, marks.  copy-mode-selection-style and
# copy-mode-position-style are deliberately NOT set: their tmux default is the
# literal string "#{E:mode-style}", i.e. they follow the value pinned below.
# The line-number styles are inert until copy-mode-line-numbers is switched on
# (default off) -- pinned anyway so that switch cannot fall back to the terminal.
set -g mode-style                           "fg=#11111b bg=#89b4fa"       # 8.91:1
set -g copy-mode-match-style               "fg=#11111b bg=#fab387"       # 10.59:1
set -g copy-mode-current-match-style       "fg=#11111b bg=#f38ba8,bold"  # 8.10:1
set -g copy-mode-mark-style                "fg=#cdd6f4 bg=#45475a"       # 6.31:1
set -g copy-mode-line-number-style         "fg=#6c7086"                 # 4.30:1 on #000000
set -g copy-mode-current-line-number-style "fg=#89b4fa,bold"           # 9.97:1 on #000000


# ---- messages and the command prompt ----------------------------------------
# message-style is the transient line (display-message, errors, prefix+r);
# fill= paints the rest of the line so the band reaches the screen edge instead
# of stopping at the text.  message-command-style is the ':' prompt, and it
# borrows the status bar's blue so the two read as one system.
set -g message-style            "fg=#11111b bg=#fab387,bold,fill=#fab387"   # 10.59:1
set -g message-command-style    "fg=#cdd6f4 bg=#10173a,fill=#10173a"       # 12.04:1


# ---- clock and pane numbers ---------------------------------------------------
# clock-mode-colour paints the prefix+t clock; clock-mode-style is pinned to 24
# so the hour format cannot drift.  display-panes-* colour the prefix+q overlay.
set -g clock-mode-colour           "#89b4fa"
set -g clock-mode-style            24
set -g display-panes-colour        "#6c7086"
set -g display-panes-active-colour "#89b4fa"


# ---- menus, popups, scrollbars, cursor ---------------------------------------
# display-menu is on prefix+< and prefix+> by default, so its colours are
# reachable in ordinary use; popups need a binding (none is shipped) but are
# pinned for the same reason.  Both use the status bar's blue so they read as
# the same system.  The border frame is the one deliberately low-contrast pair
# here (1.91:1) -- a frame only has to be visible, not legible.
# pane-scrollbars-style keeps tmux's width/pad geometry; only colours change.
# cursor-colour needs the terminal's 'cstyle' feature (check
# `tmux display-message -p '#{client_termfeatures}'`); ignored harmlessly when
# the terminal lacks it.
set -g menu-style             "fg=#cdd6f4 bg=#10173a"            # 12.04:1
set -g menu-selected-style    "fg=#11111b bg=#89b4fa,bold"      # 8.91:1
set -g menu-border-style      "fg=#45475a bg=#10173a"           # 1.91:1
set -g popup-style            "fg=#cdd6f4 bg=#10173a"           # 12.04:1
set -g popup-border-style     "fg=#45475a bg=#10173a"           # 1.91:1
set -g pane-scrollbars-style  "fg=#6c7086 bg=#11111b,width=1,pad=0"   # 3.84:1
set -g cursor-colour          "#89b4fa"                        # 9.46:1 on #090909


# ---- left at `default` on PURPOSE --------------------------------------------
# `default` in a style means two different things.  On the options above it
# means "paint nothing" -- the terminal decides -- which is why every one of
# those is pinned.  In the COMPONENT styles below it means "add no override",
# and the component then inherits a base that IS pinned.  tmux wraps them in
# #[push-default]/#[pop-default], or falls back explicitly:
# window-status-last-style's fallback to window-status-style is spelled out in
# tmux's own default status-format, and copy-mode-selection-style's default is
# the literal string "#{E:mode-style}".  Pinning these to a duplicate value
# would only create a second place to keep in sync:
#   status-right-style                inherits status-style
#   window-status-last-style          inherits window-status-style
#   copy-mode-selection-style         = #{E:mode-style}
#   copy-mode-position-style          = #{E:mode-style}
#   pane-status-* / session-status-*  used only by the pane/session status
#                                     formats; this config uses the window
#                                     format (status-format[0])
