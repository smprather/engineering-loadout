# tmux theme -- loadout1 (ORIGINAL)
#
# The theme this machine had before 2026-10-01, kept verbatim as the BASE layer.
# tmux-global.conf (managed defaults) sources this file; the dispatcher then
# sources themes/tmux-theme-loadout2.conf, which overrides every setting here.
#
# Kept for two reasons: these are the values the upstream loadout ships, and a
# theme rollback is now just "stop sourcing loadout2" rather than retyping five
# settings.
#
# tmux 3.8 theme.  This theme's identity is the terminal's ANSI palette, so
# `theme terminal` is set: the theme names below resolve to ANSI slots exactly
# as the old red/blue/white/black names did, and tmux's built-in components use
# ANSI too (the pre-3.8 behaviour).  Both palettes are defined to the same ANSI
# names anyway, so forcing `theme light` or `theme dark` from tmux-user.conf
# cannot change this theme's appearance either.
#
# CAVEAT on rollback: only these five options are restored by doing that.
# Everything else that loadout2 sets (status bar colours, the pane fill,
# pane-border-lines, window formats) exists ONLY in loadout2, so it falls back to
# tmux's own defaults -- which is in fact what the pre-2026-10-01 state was, so
# that is still a faithful rollback.  But in a RUNNING server, removing the
# source line does NOT reset those options; they keep their current values until
# a server restart or an explicit `set`.
#
# These use ANSI SLOT NAMES (red/blue/white/black), which tmux resolves against
# the TERMINAL's palette.  Under catppuccin mocha that makes the current window
# fg=white #bac2de on bg=blue #89b4fa -- both light -- i.e. 1.19:1, effectively
# invisible.  That is precisely the bug loadout2 fixed by using literal hex.


# ---- 3.8 palette -------------------------------------------------------------
# Fixed terminal-palette theme.  The values are ANSI names, not hex, on purpose:
# this is the rollback theme, and its whole character is "whatever the terminal
# palette says".  `themelightgrey`/`themedarkgrey` collapse onto white/black
# because ANSI has no separate grey slots.
set -s theme terminal

set -s dark-theme-black        "black"
set -s dark-theme-white        "white"
set -s dark-theme-light-grey   "white"
set -s dark-theme-dark-grey    "black"
set -s dark-theme-green        "green"
set -s dark-theme-yellow       "yellow"
set -s dark-theme-red          "red"
set -s dark-theme-blue         "blue"
set -s dark-theme-cyan         "cyan"
set -s dark-theme-magenta      "magenta"

set -s light-theme-black       "black"
set -s light-theme-white       "white"
set -s light-theme-light-grey  "white"
set -s light-theme-dark-grey   "black"
set -s light-theme-green       "green"
set -s light-theme-yellow      "yellow"
set -s light-theme-red         "red"
set -s light-theme-blue        "blue"
set -s light-theme-cyan        "cyan"
set -s light-theme-magenta     "magenta"


# ---- original settings -------------------------------------------------------
set -g pane-active-border-style "bg=themered fg=themered"
set -g status-right-length 0
set -g status-right ""

set -g window-status-format '#[fg=themeblack]#{window_name}'
set -g window-status-current-style "fg=themewhite bg=themeblue"
