# tmux theme -- loadout1 (ORIGINAL)
#
# The theme this machine had before 2026-10-01, kept verbatim as the BASE layer.
# tmux-global.conf (managed defaults) sources this file; the dispatcher then
# sources themes/tmux-theme-loadout2.conf, which overrides every setting here.
#
# Kept for two reasons: these are the values the upstream loadout ships, and a
# theme rollback is now just "stop sourcing loadout2" rather than retyping five
# settings.
#
# CAVEAT on rollback: only these five options are restored by doing that.
# Everything else that loadout2 sets (status bar colours, the pane fill,
# pane-border-lines, window formats) exists ONLY in loadout2, so it falls back to
# tmux's own defaults -- which is in fact what the pre-2026-10-01 state was, so
# that is still a faithful rollback.  But in a RUNNING server, removing the
# source line does NOT reset those options; they keep their current values until
# a server restart or an explicit `set`.
#
# These use ANSI SLOT NAMES (red/blue/white/black), which tmux resolves against
# the TERMINAL's palette.  Under catppuccin mocha that makes the current window
# fg=white #bac2de on bg=blue #89b4fa -- both light -- i.e. 1.19:1, effectively
# invisible.  That is precisely the bug loadout2 fixed by using literal hex.

set -g pane-active-border-style "bg=red fg=red"
set -g status-right-length 0
set -g status-right ""

set -g window-status-format '#[fg=black]#{window_name}'
set -g window-status-current-style "fg=white bg=blue"
