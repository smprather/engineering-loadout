# Assurance record -- see assurance/README.md for the schema.
# Validated by tests/assurance-check (re-hashes [artifacts] + checks the lock).
schema = 1
package = "rust-crate-store"
version = "closure-pinned"  # rolling crate set; the exact closure is pinned by assurance/crate-store.lock
verified_utc = "2026-07-07T03:50:29Z"
status = "verified"  # every .crate re-hashed against the crates.io sha256 in the store index

[source]
upstream = "crates.io"
ref = "cargo local-registry --sync (transitive closure of build/rust-crate-list.txt + rust-tool-locks.txt)"
dep_pinning = "each .crate carries the upstream crates.io sha256 in the registry index/; build/verify-crate-store re-hashes all 2101 crates against it, and the closure is committed to assurance/crate-store.lock"

[build]
script = "build/build-tool-crate-store.sh"
policy = "superset store: user seed closure UNION every loadout rust tool's Cargo.lock closure"

[scan]
engine = "scan-for-malware (YARA-Forge + optional ClamAV)"
yara_forge_tag = "20260524"
result = "clean"

[crate_store]
lock = "assurance/crate-store.lock"
verifier = "build/verify-crate-store"
count = 2101

